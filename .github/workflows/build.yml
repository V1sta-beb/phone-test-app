name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk phone-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phone-test-apk
          path: phone-test.apk

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest phone-test.apk \
            --title "Тест телефона (последняя сборка)" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. Скачайте phone-test.apk на проверяемый телефон и установите."
