plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vista.phonetest'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vista.phonetest'
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Fixed key so new builds install over old ones without uninstalling.
    signingConfigs {
        debug {
            storeFile file('phonetest.keystore')
            storePassword 'phonetest'
            keyAlias 'phonetest'
            keyPassword 'phonetest'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
