plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vista.phonetest'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vista.phonetest'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
